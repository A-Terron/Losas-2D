# Publica las dos hojas y la versión web de sus manuales en GitHub Pages en cada push a main.
name: Publicar hojas y manuales

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/requirements.txt
      - name: Instalar MkDocs
        run: pip install -r web/requirements.txt
      - name: Construir los dos manuales (falla si hay enlaces rotos)
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
        run: |
          mkdocs build --strict
          mkdocs build --strict -f mkdocs-u.yml
      - name: Copiar las hojas (Losas 2D en la raíz, Losas 2D U en /u/)
        run: |
          cp "Losas 2D - ACI 318-19.html" _site/index.html
          mkdir -p _site/u
          cp "Losas 2D U - ACI 318-19.html" _site/u/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
