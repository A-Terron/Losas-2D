# Publica la hoja y la versión web del manual en GitHub Pages en cada push a main.
name: Publicar hoja y manual

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/requirements.txt
      - name: Instalar MkDocs
        run: pip install -r web/requirements.txt
      - name: Construir el manual (falla si hay enlaces rotos)
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
        run: mkdocs build --strict
      - name: Copiar la hoja como página principal
        run: |
          cp "Losas 2D - ACI 318-19.html" _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
