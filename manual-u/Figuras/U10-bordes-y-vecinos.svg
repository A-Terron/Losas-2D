  <g fill="#2a2522"><rect x="182" y="122" width="16" height="16"/><rect x="382" y="122" width="16" height="16"/><rect x="182" y="272" width="16" height="16"/><rect x="382" y="272" width="16" height="16"/><rect x="52" y="272" width="16" height="16"/><rect x="512" y="272" width="16" height="16"/><rect x="602" y="272" width="16" height="16"/></g>
  <g text-anchor="middle" fill="#151e28">
    <text x="290" y="200" font-weight="bold" font-size="14">TABLERO</text><text x="290" y="218">ℓx × ℓy</text>
    <text x="125" y="200">vecino</text><text x="455" y="200">vecino</text><text x="565" y="200">2.º vecino</text>
    <text x="290" y="88">vecino</text><text x="290" y="330">vecino</text>
