<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" xmlns:c2pa="http://c2pa.org/manifest"><rect x="0.5" y="0.5" width="759" height="419" rx="6" fill="#ffffff" stroke="#d1d9e0"/><text x="16.0" y="24.0" text-anchor="start" fill="#7a0a10" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:14px;font-weight:700;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Método de las franjas cruzadas: flecha en el centro del tablero</text><rect x="70.0" y="70.0" width="294.8" height="235.8" fill="#e3e8ed" stroke="#8f9ba8" stroke-width="1"/><rect x="70.0" y="70.0" width="294.8" height="26.4" fill="#d6e6f8" stroke="#2a78d6" stroke-width="1" fill-opacity="0.85"/><rect x="70.0" y="279.4" width="294.8" height="26.4" fill="#d6e6f8" stroke="#2a78d6" stroke-width="1" fill-opacity="0.85"/><rect x="191.0" y="70.0" width="52.8" height="235.8" fill="#fbe2d6" stroke="#eb6834" stroke-width="1" fill-opacity="0.75"/><rect x="59.0" y="59.0" width="22.0" height="22.0" fill="#2a2522" stroke="#2a2522" stroke-width="0"/><rect x="59.0" y="294.8" width="22.0" height="22.0" fill="#2a2522" stroke="#2a2522" stroke-width="0"/><rect x="353.8" y="59.0" width="22.0" height="22.0" fill="#2a2522" stroke="#2a2522" stroke-width="0"/><rect x="353.8" y="294.8" width="22.0" height="22.0" fill="#2a2522" stroke="#2a2522" stroke-width="0"/><circle cx="217.4" cy="83.2" r="5" fill="#2a78d6" stroke="#fff" stroke-width="1.5"/><circle cx="217.4" cy="292.6" r="5" fill="#2a78d6" stroke="#fff" stroke-width="1.5"/><circle cx="217.4" cy="187.9" r="6" fill="#7a0a10" stroke="#fff" stroke-width="1.5"/><text x="382.8" y="87.2" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:700;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">franja de columna en X (sobre la viga)</text><text x="229.4" y="87.2" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:12px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Δ<tspan baseline-shift="sub" font-size="72%">cx</tspan></text><text x="251.4" y="157.9" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:700;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">franja central en Y</text><text x="229.4" y="191.9" text-anchor="start" fill="#7a0a10" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:12.5px;font-weight:700;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Δ<tspan baseline-shift="sub" font-size="72%">centro</tspan> = Δ<tspan baseline-shift="sub" font-size="72%">cx</tspan> + Δ<tspan baseline-shift="sub" font-size="72%">my</tspan></text><line x1="203.4" y1="91.2" x2="203.4" y2="179.9" stroke="#eb6834" stroke-width="1.4" stroke-linecap="round"/><path d="M201.2 174.3L203.4 179.9L205.6 174.3Z" fill="#eb6834" stroke="#eb6834" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M205.6 96.8L203.4 91.2L201.2 96.8Z" fill="#eb6834" stroke="#eb6834" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="197.4" y="149.0" text-anchor="end" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:12px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Δ<tspan baseline-shift="sub" font-size="72%">my</tspan></text><text x="70.0" y="336.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">1. La franja de columna en X (sobre las vigas) baja Δ<tspan baseline-shift="sub" font-size="72%">cx</tspan> en el centro de su claro.</text><text x="70.0" y="353.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">2. La franja central en Y se apoya en esas dos franjas y baja Δ<tspan baseline-shift="sub" font-size="72%">my</tspan> más, medido respecto a ellas.</text><text x="70.0" y="370.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">3. Se repite cruzando las direcciones (Δ<tspan baseline-shift="sub" font-size="72%">cy</tspan> + Δ<tspan baseline-shift="sub" font-size="72%">mx</tspan>) y se promedian las dos sumas.</text><text x="70.0" y="387.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Flecha relativa a las vigas (criterio de clase): solo Δ<tspan baseline-shift="sub" font-size="72%">my</tspan> o Δ<tspan baseline-shift="sub" font-size="72%">mx</tspan>, la más desfavorable.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>