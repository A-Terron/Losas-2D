round">s<tspan baseline-shift="sub" font-size="72%">máx</tspan> = mín(2h, 45 cm) = 30 cm</text><text x="520.0" y="152.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:12px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"></text><text x="520.0" y="169.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:12px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">s = 25 cm  (múltiplo de 2.5</text><text x="520.0" y="186.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:12px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">    hacia abajo)</text><text x="520.0" y="203.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:12px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"></text><text x="520.0" y="220.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:12px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">A<tspan baseline-shift="sub" font-size="72%">s,prov</tspan> = 0.71 / 0.25</text><text x="520.0" y="237.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:12px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">    = 2.84 cm²/m ≥ 2.70</text><text x="70.0" y="262.0" text-anchor="start" fill="#4a5765" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Redondear hacia arriba (27.5 cm) dejaría 2.58 cm²/m, menos que el mínimo de 2.70 cm²/m. Por eso se redondea</text><text x="70.0" y="277.0" text-anchor="start" fill="#4a5765" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">hacia abajo.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>