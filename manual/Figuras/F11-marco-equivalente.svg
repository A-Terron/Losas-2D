" text-anchor="middle" fill="#7a8693" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">empotramiento en la cimentación</text><text x="90.0" y="366.0" text-anchor="start" fill="#4a5765" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">La losa no se apoya directamente en la columna en todo su ancho: le llega a través del miembro transversal,</text><text x="90.0" y="381.0" text-anchor="start" fill="#4a5765" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">que se tuerce.</text><text x="90.0" y="396.0" text-anchor="start" fill="#4a5765" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Por eso columna y miembro a torsión se combinan en una «columna equivalente» K<tspan baseline-shift="sub" font-size="72%">ec</tspan>, más flexible que la</text><text x="90.0" y="411.0" text-anchor="start" fill="#4a5765" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">columna sola.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>