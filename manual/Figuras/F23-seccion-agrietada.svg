</tspan> = 8.04.</text><text x="70.0" y="283.0" text-anchor="start" fill="#4a5765" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:12px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Eje 6, claro I–K: I<tspan baseline-shift="sub" font-size="72%">g</tspan> = 1 601 835 cm⁴ y I<tspan baseline-shift="sub" font-size="72%">cr</tspan> = 141 734 cm⁴ (9 % de la bruta).</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>