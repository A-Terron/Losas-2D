;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Eje F, eje 6 (HT1):</text><text x="560.0" y="150.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:12px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">ΣK<tspan baseline-shift="sub" font-size="72%">c</tspan> = 14 328</text><text x="560.0" y="168.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:12px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">K<tspan baseline-shift="sub" font-size="72%">ta</tspan> = 755 085</text><text x="560.0" y="186.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:12px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">K<tspan baseline-shift="sub" font-size="72%">ec</tspan> = 14 062 tonf·m</text><text x="60.0" y="226.0" text-anchor="start" fill="#4a5765" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">En serie se suman las flexibilidades. El resultado siempre es menor que el más flexible de los dos.</text><text x="60.0" y="241.0" text-anchor="start" fill="#4a5765" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Con vigas, K<tspan baseline-shift="sub" font-size="72%">ta</tspan> es enorme y K<tspan baseline-shift="sub" font-size="72%">ec</tspan> ≈ ΣK<tspan baseline-shift="sub" font-size="72%">c</tspan>; sin vigas, el miembro a torsión es débil y K<tspan baseline-shift="sub" font-size="72%">ec</tspan> cae mucho.</text><metadata><c2pa:manifest></c2pa:manifest></metadata>