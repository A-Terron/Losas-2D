ize:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">borde 35 × 60 con losa de 15.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>