 y="104.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:12px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"></text><text x="520.0" y="122.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:12px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Nudo F del eje 6 (tonf·m):</text><text x="520.0" y="140.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:12px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">ΣK = 73 658</text><text x="520.0" y="158.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:12px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">FD izq = 0.469</text><text x="520.0" y="176.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:12px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">FD der = 0.340</text><text x="520.0" y="194.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:12px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">FD columna = 0.191</text><text x="60.0" y="262.0" text-anchor="start" fill="#4a5765" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">El momento desequilibrado del nudo se reparte en proporción a la rigidez de cada miembro que llega a él.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>