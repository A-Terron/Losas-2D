<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 334" width="760" height="334" role="img" xmlns:c2pa="http://c2pa.org/manifest"><rect x="0.5" y="0.5" width="759" height="333" rx="6" fill="#ffffff" stroke="#d1d9e0"/><text x="16.0" y="24.0" text-anchor="start" fill="#7a0a10" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:14px;font-weight:700;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Qué parte de la flecha se compara con cada límite</text><rect x="80.0" y="80.0" width="150.0" height="34.0" fill="#c9d1da" stroke="#7a8693" stroke-width="1"/><text x="155.0" y="101.0" text-anchor="middle" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;">inmediata por D</text><rect x="230.0" y="80.0" width="150.0" height="34.0" fill="#fbe2d6" stroke="#7a8693" stroke-width="1"/><text x="305.0" y="101.0" text-anchor="middle" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;">inmediata por L</text><rect x="380.0" y="80.0" width="300.0" height="34.0" fill="#d6e6f8" stroke="#7a8693" stroke-width="1"/><text x="530.0" y="101.0" text-anchor="middle" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;">largo plazo: λΔ · Δ sostenida</text><line x1="230.0" y1="140.0" x2="380.0" y2="140.0" stroke="#4a5765" stroke-width="1" stroke-linecap="round"/><line x1="230.0" y1="135.0" x2="230.0" y2="145.0" stroke="#4a5765" stroke-width="1" stroke-linecap="round"/><line x1="380.0" y1="135.0" x2="380.0" y2="145.0" stroke="#4a5765" stroke-width="1" stroke-linecap="round"/><line x1="230.0" y1="114.0" x2="230.0" y2="140.0" stroke="#d1d9e0" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="380.0" y1="114.0" x2="380.0" y2="140.0" stroke="#d1d9e0" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2 3"/><text x="305.0" y="154.0" text-anchor="middle" fill="#4a5765" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Δ<tspan baseline-shift="sub" font-size="72%">i,L</tspan> ≤ ℓ/360</text><line x1="230.0" y1="178.0" x2="680.0" y2="178.0" stroke="#4a5765" stroke-width="1" stroke-linecap="round"/><line x1="230.0" y1="173.0" x2="230.0" y2="183.0" stroke="#4a5765" stroke-width="1" stroke-linecap="round"/><line x1="680.0" y1="173.0" x2="680.0" y2="183.0" stroke="#4a5765" stroke-width="1" stroke-linecap="round"/><line x1="230.0" y1="114.0" x2="230.0" y2="178.0" stroke="#d1d9e0" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="680.0" y1="114.0" x2="680.0" y2="178.0" stroke="#d1d9e0" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2 3"/><text x="455.0" y="192.0" text-anchor="middle" fill="#4a5765" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Δ<tspan baseline-shift="sub" font-size="72%">post</tspan> = λΔ·Δ<tspan baseline-shift="sub" font-size="72%">i,sost</tspan> + Δ<tspan baseline-shift="sub" font-size="72%">i,L</tspan> ≤ ℓ/240 (o ℓ/480)</text><line x1="80.0" y1="64.0" x2="680.0" y2="64.0" stroke="#4a5765" stroke-width="1" stroke-linecap="round"/><line x1="80.0" y1="59.0" x2="80.0" y2="69.0" stroke="#4a5765" stroke-width="1" stroke-linecap="round"/><line x1="680.0" y1="59.0" x2="680.0" y2="69.0" stroke="#4a5765" stroke-width="1" stroke-linecap="round"/><line x1="80.0" y1="80.0" x2="80.0" y2="64.0" stroke="#d1d9e0" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="680.0" y1="80.0" x2="680.0" y2="64.0" stroke="#d1d9e0" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2 3"/><text x="380.0" y="59.0" text-anchor="middle" fill="#4a5765" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Δ<tspan baseline-shift="sub" font-size="72%">total</tspan> = Δ<tspan baseline-shift="sub" font-size="72%">i,D+L</tspan> + λΔ·Δ<tspan baseline-shift="sub" font-size="72%">i,sost</tspan></text><text x="80.0" y="220.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Carga sostenida = D + ψ·L, con ψ = 0.25 en parqueos.   λΔ = ξ / (1 + 50ρ′) = 2.0 para 5 años o más y sin</text><text x="80.0" y="237.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">acero de compresión.</text><text x="80.0" y="254.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"></text><text x="80.0" y="271.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">ℓ/360: pisos que no sostienen elementos frágiles (flecha inmediata por carga viva).</text><text x="80.0" y="288.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">ℓ/240: flecha posterior a la colocación de elementos no estructurales que no se dañan con deflexiones</text><text x="80.0" y="305.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">grandes.</text><text x="80.0" y="322.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">ℓ/480: lo mismo, cuando esos elementos sí pueden dañarse (tabiques frágiles, vidrio).</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>