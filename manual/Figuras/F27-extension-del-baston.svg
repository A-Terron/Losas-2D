oke-width="3" stroke-linejoin="round">máx(d, 12d<tspan baseline-shift="sub" font-size="72%">b</tspan>, ℓ<tspan baseline-shift="sub" font-size="72%">n</tspan>/16)</text><line x1="172.0" y1="122.0" x2="508.4" y2="122.0" stroke="#4a5765" stroke-width="1" stroke-linecap="round"/><line x1="172.0" y1="117.0" x2="172.0" y2="127.0" stroke="#4a5765" stroke-width="1" stroke-linecap="round"/><line x1="508.4" y1="117.0" x2="508.4" y2="127.0" stroke="#4a5765" stroke-width="1" stroke-linecap="round"/><line x1="172.0" y1="92.0" x2="172.0" y2="122.0" stroke="#d1d9e0" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="508.4" y1="92.0" x2="508.4" y2="122.0" stroke="#d1d9e0" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="2 3"/><text x="340.2" y="136.0" text-anchor="middle" fill="#4a5765" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">extensión desde la cara del apoyo</text><text x="150.0" y="306.0" text-anchor="middle" fill="#7a8693" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">apoyo</text><text x="60.0" y="336.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">La extensión es la mayor de tres: (1) la fracción de ℓ<tspan baseline-shift="sub" font-size="72%">n</tspan> de la Fig. 8.7.4.1.3 — 0.22 en franja central y 0.30 en</text><text x="60.0" y="353.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">franja de columna —,</text><text x="60.0" y="370.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">(2) el punto de inflexión más máx(d, 12d<tspan baseline-shift="sub" font-size="72%">b</tspan>, ℓ<tspan baseline-shift="sub" font-size="72%">n</tspan>/16), y (3) la longitud de desarrollo ℓ<tspan baseline-shift="sub" font-size="72%">d</tspan>. Luego se redondea hacia</text><text x="60.0" y="387.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">arriba a múltiplos de 5 cm.</text><text x="60.0" y="404.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Es el mismo criterio de clase para vigas: desde donde la barra deja de ser necesaria, se prolonga d o 12d<tspan baseline-shift="sub" font-size="72%">b</tspan>.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>