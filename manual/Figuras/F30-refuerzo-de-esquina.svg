-size:12px;font-weight:700;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">tablero de esquina (T3)</text><text x="80.0" y="338.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Cuándo: esquinas exteriores con vigas de borde de α<tspan baseline-shift="sub" font-size="72%">f</tspan> > 1.0 (o muros). La esquina quiere levantarse y aparece</text><text x="80.0" y="355.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">torsión.</text><text x="80.0" y="372.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Cuánto: acero para el mayor momento positivo por metro del tablero (aquí 0.97 tonf·m/m → #3 @ 25 cm).</text><text x="80.0" y="389.0" text-anchor="start" fill="#1b2733" style="font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;font-size:11.5px;font-weight:400;" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Dónde: arriba y abajo, en las dos direcciones, en un cuadrado de un quinto del claro mayor.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>